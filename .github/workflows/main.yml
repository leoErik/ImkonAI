
name: Build ImkonAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android --org uz.imkonai

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.CALL_PHONE",
              "android.permission.SEND_SMS",
              "android.permission.READ_CONTACTS",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.FLASHLIGHT"
          ]

          additions = "".join(
              f'    <uses-permission android:name="{p}" />\n'
              for p in permissions
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace("<manifest", "<manifest", 1)
              pos = text.find(">")
              text = text[:pos+1] + "\n" + additions + text[pos+1:]

          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImkonAI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
