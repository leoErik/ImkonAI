
name: Build ImkonAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android --org uz.imkonai

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  match = re.search(r'<manifest\b[^>]*>', text)
                  if not match:
                      raise RuntimeError("Manifest ochilmadi")
                  text = text[:match.end()] + "\n    " + tag + text[match.end():]

          if "<queries>" not in text:
              text = text.replace(
                  "<application",
                  """<queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application""",
                  1
              )

          text = text.replace('android:label="imkanai"', 'android:label="ImkonAI"')
          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK with Gemini key
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImkonAI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
